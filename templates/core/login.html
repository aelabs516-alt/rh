{% extends 'core/base.html' %}
{% load static %}
{% block content %}
     <div id="modal-login-session" class="modal-overlay" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background-color:var(--bg-primary); z-index:2003; align-items:center; justify-content:center; padding: 20px;">
         <div class="glass-card" style="max-width: 450px; width: 100%; padding: 40px; animation: slideIn 0.3s ease-out; background-color:var(--sidebar-bg); text-align: center; border: 1px solid var(--card-border);">
             <div style="color: var(--accent); margin-bottom: 20px; display: flex; justify-content: center;">
                 <svg style="width: 60px; height: 60px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
             </div>
             <h3 style="font-weight: 700; margin-bottom: 10px; font-size: 1.4rem; color: var(--text-primary);">Sistema de Marcación</h3>
             <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 30px; line-height: 1.5;">
                 Inicie sesión para acceder al panel de control y funciones.
             </p>

             <form id="login-form" data-turbo="false">
                 {% csrf_token %}
                 <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                     <label for="login-user-type" style="font-weight: 600; margin-bottom: 6px; display: block; font-size: 0.8rem; color: var(--text-secondary);">Tipo de Usuario</label>
                     <select id="login-user-type" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--card-border); background-color: var(--bg-primary); color: var(--text-primary); outline: none; font-size: 1rem;">
                         <option value="ADMINISTRADOR">Administrador Global</option>
                         <option value="COLABORADOR">Colaborador (Empleado)</option>
                         <option value="JEFE_INMEDIATO">Jefe Inmediato</option>
                     </select>
                 </div>
                 
                 <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                     <label for="login-cedula" style="font-weight: 600; margin-bottom: 6px; display: block; font-size: 0.8rem; color: var(--text-secondary);">Número de Cédula</label>
                     <div style="position: relative;">
                         <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">
                             <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                         </div>
                         <input type="text" id="login-cedula" inputmode="numeric" pattern="[0-9]*" required placeholder="Ej: 1036632383" style="width: 100%; padding: 12px 12px 12px 40px; border-radius: var(--radius-md); border: 1px solid var(--card-border); background-color: var(--bg-primary); color: var(--text-primary); outline: none; font-size: 1rem;">
                     </div>
                 </div>

                 <div class="form-group" id="login-password-container" style="text-align: left; margin-bottom: 30px;">
                     <label for="login-password" style="font-weight: 600; margin-bottom: 6px; display: block; font-size: 0.8rem; color: var(--text-secondary);">Contraseña</label>
                     <div style="position: relative;">
                         <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">
                             <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                         </div>
                         <input type="password" id="login-password" required placeholder="Tu contraseña" style="width: 100%; padding: 12px 12px 12px 40px; border-radius: var(--radius-md); border: 1px solid var(--card-border); background-color: var(--bg-primary); color: var(--text-primary); outline: none; font-size: 1rem;">
                     </div>
                 </div>

                 <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem; justify-content: center; display: flex; align-items: center; gap: 8px;">
                     <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                     Ingresar al Sistema
                 </button>
             </form>
         </div>
     </div>
     
     <script>
         const userTypeSelect = document.getElementById('login-user-type');
         const cedulaInput = document.getElementById('login-cedula');
         
         const form = document.getElementById('login-form');
         if(form) {
             form.addEventListener('submit', async (e) => {
                 e.preventDefault();
                 const payload = {
                     user_type: userTypeSelect.value,
                     cedula: cedulaInput.value,
                     password: document.getElementById('login-password').value
                 };
                 
                 try {
                     const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                     const res = await fetch('{% url "login" %}', {
                         method: 'POST',
                         credentials: 'same-origin',
                         headers: {
                             'Content-Type': 'application/json',
                             'X-CSRFToken': csrfToken
                         },
                         body: JSON.stringify(payload)
                     });
                     const data = await res.json();
                     if (data.success) {
                         window.location.href = '{% url "dashboard" %}';
                     } else {
                         alert(data.message);
                     }
                 } catch (err) {
                     alert("Error de conexin");
                 }
             });
         }
     </script>
{% endblock %}
